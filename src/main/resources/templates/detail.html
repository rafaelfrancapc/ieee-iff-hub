<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/shell :: head(${pageTitle})}"></head><body>
<header th:replace="~{fragments/shell :: header}"></header>
<main id="conteudo" class="container main-content">
<nav class="breadcrumb" aria-label="Localização"><a th:href="@{/{collection}(collection=${collection})}" th:text="${collection == 'servicos' ? 'Serviços' : 'Documentação'}"></a><span aria-hidden="true">/</span><span th:text="${entry.title}"></span></nav>
<div class="detail-layout"><article class="detail-article"><div class="page-heading"><h1 th:text="${entry.title}"></h1><p th:text="${entry.summary}"></p></div><div class="document-body" th:utext="${body}"></div></article>
<aside class="resource-aside" aria-label="Informações do recurso"><h2>Informações de acesso</h2><dl><div><dt>Categoria</dt><dd th:text="${entry.category}"></dd></div><div><dt>Acesso</dt><dd th:text="${entry.access}"></dd></div><div><dt>Situação</dt><dd th:text="${entry.state}"></dd></div></dl><p class="source-note" th:text="${entry.source}"></p>
<div class="resource-action" th:if="${!externalUrl.isEmpty()}"><a class="button" th:href="${externalUrl}" th:target="${externalUrl.startsWith('http') ? '_blank' : null}" th:rel="${externalUrl.startsWith('http') ? 'noopener noreferrer' : null}"><span th:text="${entry.linkKey == 'account' ? 'Gerenciar minha conta' : (entry.linkKey == 'nextcloud' ? 'Abrir nuvem' : (entry.linkKey == 'repositories' ? 'Abrir repositórios' : 'Abrir documentação'))}"></span><svg th:replace="~{fragments/shell :: icon('external')}"></svg></a></div>
<div class="resource-action" th:if="${!entry.linkKey.isEmpty() and externalUrl.isEmpty()}"><button type="button" class="button" disabled>Acesso em preparação</button><p>O endereço deste serviço ainda não foi disponibilizado.</p></div><a class="text-link aside-help" th:href="@{/ajuda}">Ajuda de acesso<svg th:replace="~{fragments/shell :: icon('arrow-right')}"></svg></a>
</aside></div></main><footer th:replace="~{fragments/shell :: footer}"></footer></body></html>
